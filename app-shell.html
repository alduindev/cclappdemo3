<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>App CCL</title><style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#e9f0f5}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="cclApp" src="/index.html" title="App CCL"></iframe><script id="cclPatch" type="text/plain">(function(){function firstName(){const raw=(user&&user.name)||(state.activeProfile&&state.activeProfile.name)||'Usuario';return String(raw).trim().split(/\s+/)[0]}function profileLabel(){const p=state.activeProfile;if(!p)return'Tu cuenta CCL';return p.type==='empresa'?p.name:'Tu cuenta CCL'}function ico(name,size){try{return icon(name,size||'')}catch(e){return''}}function xico(name,size){try{return extraIcon(name,size||'')}catch(e){return ico(name,size)}}if(cfg.home==='concierge')cfg.title='Mi CCL';renderTopbar=function(){const p=state.activeProfile||{};if(state.page==='home')return `<div class="topbar"><div><h2>Hola, ${firstName()}</h2><p>${profileLabel()}</p></div><button class="avatar" onclick="goToPage('profile')">${p.type==='empresa'?'E':'AS'}</button></div>`;const titles={services:'Servicios',events:'Eventos',news:'Noticias',network:'Conecta Empresas',camila:'Camila',profile:'Perfil',profileEdit:'Editar perfil'};const subtitles={services:'Soluciones para tu empresa',events:'Agenda CCL',news:'Actualidad empresarial',network:'Afinidad por intereses',camila:'Asistente virtual',profile:'Cuenta y seguridad',profileEdit:'Actualiza tus datos'};return `<div class="topbar"><div><h2>${titles[state.page]||'Mi CCL'}</h2><p>${subtitles[state.page]||''}</p></div><button class="avatar" onclick="goToPage('profile')">${p.type==='empresa'?'E':'AS'}</button></div>`};homeView=function(){const p=state.activeProfile||{},account=profileLabel();if(cfg.home==='banking')return `<div class="view"><div class="hero" style="background:linear-gradient(135deg,rgba(13,47,82,.96),rgba(31,111,167,.78)),url('${cfg.hero}') center/cover no-repeat"><span class="tag">${p.type==='empresa'?'Empresa activa':'Cuenta personal'}</span><div><h3>Tu espacio CCL</h3><p>${account}</p></div></div><div class="bank-summary"><button class="bank-tile tap-card" onclick="goToPage('services')"><div class="tile-top"><small>Servicios</small><div class="tile-icon">${ico('services','sm')}</div></div><strong>+60</strong><small>Ver soluciones CCL</small></button><button class="bank-tile tap-card" onclick="goToPage('events')"><div class="tile-top"><small>Agenda</small><div class="tile-icon">${ico('calendar','sm')}</div></div><strong>04</strong><small>Ver próximos eventos</small></button></div><button class="match-teaser tap-card" onclick="goToPage('network')"><div><strong>Conecta Empresas</strong><small>3 nuevas coincidencias según los intereses de tu empresa.</small></div><div class="match-badge">${xico('network')}</div></button><button class="bank-action tap-card" onclick="goToPage('camila')"><div class="aicon">${ico('sparkle')}</div><div><strong>¿Necesitas ayuda?</strong><small>Pregúntale a Camila sobre servicios y gestiones.</small></div><span class="tap-arrow">${ico('arrow')}</span></button></div>`;if(cfg.home==='discovery')return `<div class="view"><button class="web-hero tap-card" style="background-image:linear-gradient(180deg,rgba(8,22,34,.08),rgba(8,22,34,.78)),url('${cfg.hero}')" onclick="goToPage('network')"><div class="web-hero-copy"><b>PARA TU EMPRESA</b><strong>Descubre nuevas oportunidades</strong><small>Conecta con empresas, servicios y beneficios según tus intereses.</small></div></button><div class="photo-row"><button class="photo-tile tap-card" style="background-image:linear-gradient(180deg,rgba(4,15,25,.04),rgba(4,15,25,.72)),url('${cfg.hero}')" onclick="goToPage('services')"><span>Servicios recomendados</span></button><button class="photo-tile tap-card" style="background-image:linear-gradient(180deg,rgba(4,15,25,.04),rgba(4,15,25,.72)),url('${cfg.hero}')" onclick="goToPage('news')"><span>Actualidad empresarial</span></button></div><button class="match-teaser tap-card" onclick="goToPage('events')"><div><strong>Tu agenda CCL</strong><small>Consulta las próximas actividades.</small></div><div class="match-badge">${ico('calendar')}</div></button></div>`;if(cfg.home==='productivity')return `<div class="view"><div class="productivity-head"><div class="head-row"><div><strong>Resumen de hoy</strong><small>Acciones que requieren tu atención</small></div><svg class="svg-progress" viewBox="0 0 56 56" aria-label="76 por ciento"><circle class="track" cx="28" cy="28" r="24"/><circle class="value" cx="28" cy="28" r="24"/></svg></div></div><div class="task-list"><button class="task-row tap-card" onclick="goToPage('services')"><div class="task-icon">${ico('check','sm')}</div><div><strong>1 gestión por revisar</strong><small>Revisa tus servicios y solicitudes</small></div><b>Ver</b></button><button class="task-row tap-card" onclick="goToPage('network')"><div class="task-icon">${xico('network','sm')}</div><div><strong>3 empresas compatibles</strong><small>Nuevas coincidencias según tus intereses</small></div><b>Nuevo</b></button><button class="task-row tap-card" onclick="goToPage('profile')"><div class="task-icon">${xico('edit','sm')}</div><div><strong>Revisa tu perfil empresarial</strong><small>Mantén tus datos e intereses actualizados</small></div><b>Perfil</b></button></div><div class="command-grid"><button class="command tap-card" onclick="goToPage('events')">${ico('calendar','sm')}<strong>Agenda</strong><small>Próximas actividades</small></button><button class="command tap-card" onclick="goToPage('camila')">${ico('sparkle','sm')}<strong>Camila</strong><small>Asistencia directa</small></button></div></div>`;return `<div class="view"><button class="web-hero tap-card" style="background-image:linear-gradient(180deg,rgba(8,22,34,.08),rgba(8,22,34,.82)),url('${cfg.hero}')" onclick="goToPage('network')"><div class="web-hero-copy"><b>PARA TI</b><strong>Conecta y haz crecer tu empresa</strong><small>Oportunidades, contactos y atención personalizada desde un solo lugar.</small></div></button><div class="member-actions"><button class="panel tap-card" onclick="goToPage('services')"><h3>Servicios</h3><p>Soluciones CCL</p></button><button class="panel tap-card" onclick="goToPage('network')"><h3>Conectar</h3><p>Empresas afines</p></button><button class="panel tap-card" onclick="goToPage('camila')"><h3>Camila</h3><p>Consultar</p></button></div><button class="match-teaser tap-card" onclick="goToPage('events')"><div><strong>Tu próxima actividad</strong><small>4 actividades disponibles este mes. Revisa la agenda completa.</small></div><div class="match-badge">${ico('calendar')}</div></button><button class="panel tap-card" onclick="goToPage('news')"><div class="compact-section-head"><div><strong>Noticias para tu empresa</strong><small>Consulta las novedades empresariales.</small></div>${xico('news','sm')}</div></button></div>`};document.title='App CCL';if(state.screen==='app')render()})();</script><script>const frame=document.getElementById('cclApp');frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;const script=doc.createElement('script');script.textContent=document.getElementById('cclPatch').textContent;doc.documentElement.appendChild(script)}catch(e){console.error(e)}})</script></body></html>
